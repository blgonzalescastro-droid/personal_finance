components:
  schemas:
    Card:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        card_number:
          type: string
          maxLength: 16
        card_holder:
          type: string
          maxLength: 100
        expire_date:
          type: string
          maxLength: 5
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        weekly_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        is_active:
          type: boolean
        user:
          type: integer
          readOnly: true
      required:
      - card_holder
      - card_number
      - expire_date
      - id
      - user
    CategoryEnum:
      enum:
      - Shopping
      - Electronics
      - Travels
      - Food
      - Sport
      type: string
      description: |-
        * `Shopping` - Shopping
        * `Electronics` - Electronics
        * `Travels` - Travels
        * `Food` - Food
        * `Sport` - Sport
    Goal:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        target_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        target_date:
          type: string
          format: date
        user:
          type: integer
          readOnly: true
      required:
      - id
      - target_amount
      - target_date
      - title
      - user
    PatchedCard:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        card_number:
          type: string
          maxLength: 16
        card_holder:
          type: string
          maxLength: 100
        expire_date:
          type: string
          maxLength: 5
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        weekly_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        is_active:
          type: boolean
        user:
          type: integer
          readOnly: true
    PatchedGoal:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        target_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        target_date:
          type: string
          format: date
        user:
          type: integer
          readOnly: true
    PatchedTransaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        receiver:
          type: string
          maxLength: 100
        category:
          $ref: '#/components/schemas/CategoryEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        date:
          type: string
          format: date
          readOnly: true
        user:
          type: integer
          readOnly: true
    Register:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - password
      - username
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    Transaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        receiver:
          type: string
          maxLength: 100
        category:
          $ref: '#/components/schemas/CategoryEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        date:
          type: string
          format: date
          readOnly: true
        user:
          type: integer
          readOnly: true
      required:
      - amount
      - category
      - date
      - id
      - receiver
      - user
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
